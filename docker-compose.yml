services:

  db:
    image: postgres:17
    container_name: orca-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orca123
      POSTGRES_DB: orca_scorer

    ports:
      - "5432:5432"

    volumes:
      - orca_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orca_scorer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: orca-backend

    ports:
      - "8000:8000"

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: orca_scorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orca123

    depends_on:
      db:
        condition: service_healthy
  

  frontend:
    build: ./frontend
    container_name: orca-frontend

    ports:
      - "5173:5173"

    environment:
      API_PROXY_TARGET: http://backend:8000

    depends_on:
      - backend

volumes:
  orca_postgres_data: